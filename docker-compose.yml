version: "3.9"

services:

  backend:
    build: ./backend
    container_name: financial_backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: financial_frontend

    ports:
      - "8501:8501"

    volumes:
      - ./frontend:/app

    depends_on:
      - backend